[project]
name = "smetabystro-backend"
version = "0.1.0"
description = "Сервис расчёта смет и коммерческих предложений для малых строительных подрядчиков (MVP пилота)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.4",
    "pydantic==2.9.2",
    "sqlalchemy==2.0.35",
    "uvicorn[standard]==0.30.6",
    "weasyprint==62.3",
    "pydyf<0.11.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
